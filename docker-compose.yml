services:
  carro-do-ovo-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carro-do-ovo-web
    ports:
      - "8081:8081"
    environment:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run docker:web

  carro-do-ovo-checks:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carro-do-ovo-checks
    environment:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run check
